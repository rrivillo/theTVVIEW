# Ejecución de la suite en los sistemas operativos que la app soporta.
#
# La app es una TUI (curses) con almacenamiento local y, opcionalmente, un
# reproductor externo. Eso hace que **la plataforma sea parte del contrato**:
# `os.replace`, el `fsync` del directorio y los permisos 0600 no se comportan
# igual en Linux, macOS y Windows, y la escritura atómica es justo la garantía
# que no se puede comprobar en un solo sistema.
#
# Por eso la matriz corre la suite completa en los tres sistemas, y no sólo en
# Linux: un fallo de permisos o de reemplazo en Windows sería invisible.
#
# Lo que **no** se hace aquí:
# - Instalar reproductores. La suite que los necesita está marcada como tal y
#   se registra como omitida; no se finge que pasó.
# - Lanzar la TUI con una terminal real. Los tests de interfaz usan un `stdscr`
#   simulado, igual que en local.

name: suite

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancela intentos anteriores de la misma rama: la cola de un push sucesivo
# no aporta nada y ocupa minutos de runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Si un sistema falla, se sigue probando el resto: el informe debe decir
      # qué plataformas funcionan, no quedarse en la primera que se rompió.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Mostrar la versión en uso
        run: python -VV

      # El proyecto tiene cero dependencias pip. El requirements.txt vacío se
      # instala igual, a propósito: si algún día alguien añade una dependencia
      # sin darse cuenta, este paso es donde se nota y no en el usuario final.
      - name: Instalar dependencias (debería estar vacío)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # La app guarda datos en ./data. En Windows el checkout trae permisos
      # distintos, y `chmod_private` es best-effort: se comprueba aquí que no
      # rompe nada al crear el directorio.
      - name: Verificar que no hay dependencias pip
        run: python -m thetvview.security.check

      - name: Suite de tests
        run: python -m unittest discover -s tests -v

  analisis-estatico:
    name: Análisis estático
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar mypy
        run: python -m pip install mypy

      # mypy es **opcional** y no falla el workflow: el proyecto no declara
      # mypy como requisito y cero dependencias pip es una restricción dura.
      # Se instala sólo aquí, en un job aparte, para que un error de tipos no
      # bloquee la suite que sí importa.
      - name: mypy (informativo)
        continue-on-error: true
        run: python -m mypy thetvview/ --ignore-missing-imports
